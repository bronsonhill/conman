[[fixture]]
name = "posthog"
url = "https://github.com/PostHog/posthog.git"
sha = "41570ae96afb3b0fd74d2873d68037553aaaec8d"
branch = "master"
license = "MIT (ee/ subtree is proprietary; not an entry point here)"
entry_points = [
  ".",
  "common",
  "frontend/src/scenes/max",
  "posthog/temporal/data_modeling",
  "products/customer_analytics/frontend/components/Accounts",
]
notes = """
Overgrown monorepo. CLAUDE.md and AGENTS.md exist as a pair in ~40 directories,
and in every one CLAUDE.md is a symlink to its sibling AGENTS.md. Sizes vary by
directory: the root pair is ~42 KB (42408 bytes), the common/ pair is 1739
bytes. Because each pair is one file on disk, the resolver counts it once and
raises no finding; no pair has drifted, so there are zero value-conflict
findings across the map. This is the fixture that proves conman does not flag
the symlinked multi-tool layout and does not double-count a symlinked
CLAUDE.md/AGENTS.md into the stack. Nesting runs 6 levels deep
(products/customer_analytics/frontend/components/Accounts/). 13 .claude/rules/.
.claude/settings.json is hooks + plugins, no resolution keys. Many entry points
for `conman map`, all large enough to fail on over-budget.
"""


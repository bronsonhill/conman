name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test

      # conman is held to its own checks: gate this repo's context stack,
      # dogfooding the published action rather than the local build.
      - name: conman self-check
        uses: bronsonhill/conman-action@v1
        with:
          path: .

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      # setup-node's node 22 ships an npm older than the 11.5.1 that trusted
      # publishing (OIDC) needs, so pull a current npm before publishing.
      - run: npm install -g npm@latest
      - run: npm publish --access public

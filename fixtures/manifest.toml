"""

[[fixture]]
name = "lila"
url = "https://github.com/lichess-org/lila.git"
sha = "9b49f37fe9d953c85dae12bbc159a0bf721a9fca"
branch = "master"
license = "AGPL-3.0"
entry_points = [".", "modules/tournament", "modules/game", "ui/analyse"]
notes = """
Single-entry scale fixture: ~16.7k files, 765 directories, 85 SBT modules under
modules/ and 42 UI packages under ui/, yet `conman map` discovers exactly one
entry point (the root). None of those subdirs carry a CLAUDE.md or AGENTS.md,
and there is no .claude/rules/ with `paths:` globs, so nothing below the root is
discoverable. The stack itself is shallow: a root CLAUDE.md and AGENTS.md only,
no .claude/ directory, no imports, no rules, no skills. At the pinned SHA the
root CLAUDE.md is a symlink to AGENTS.md (6387 bytes), so like posthog it is one
file counted once, with no finding. Exercises discovery and resolution over a
large tree that still collapses to a single entry point.
"""


# conman fixture corpus
#
# One [[fixture]] table per repo. scripts/fetch-fixtures.sh clones each into
# fixtures/repos/<name> at the pinned `sha` (gitignored, never committed).
#
# Fields:
#   name      directory name under fixtures/repos/ (kebab-case, unique)
#   url       https git URL, clonable without credentials
#   sha       full 40-char commit SHA to check out (pinned; no floating refs)
#   branch    branch the SHA was taken from, for a shallow fetch
#   license   SPDX id where one applies, or the license name for source-available repos
#   entry_points  directories to point `conman` / `conman map` at, relative to the repo root
#   notes     which conman behaviors this fixture exercises
#
# To refresh a pin: bump `sha` (and `branch` if it moved), update `notes` if the
# stack changed shape, re-run the fetch script. See fixtures/README.md.

[[fixture]]
name = "llm"
url = "https://github.com/simonw/llm.git"
sha = "a463c6318f65a48ae185733a0655dca7bb00c3e1"
branch = "main"
license = "Apache-2.0"
entry_points = ["."]
notes = """
A single root AGENTS.md, no CLAUDE.md, no .claude/ directory, no imports, no
rules, no skills. At resolution model 0.2 a bare AGENTS.md with no CLAUDE.md is
not loaded, so this resolves to a zero-file, zero-token stack with the
"AGENTS.md present but not loaded" note. Exercises the bare-AGENTS.md-is-not-
loaded path and checks conman does nothing surprising when the stack is empty.
"""

